<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vũ Trụ Toán Học 3D - Moderate Size Formulas (120 FPS)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Math & Tech UI -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Inter:wght@300;400;600;700;800&family=Lora:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #010103;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            cursor: none; /* Hide default OS cursor */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .math-font {
            font-family: 'Cambria Math', 'Latin Modern Math', 'Fira Code', 'Times New Roman', serif;
        }
        .glass-panel {
            background: rgba(4, 7, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.85);
        }
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            height: 6px;
            cursor: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #00f3ff;
            cursor: none;
            box-shadow: 0 0 12px #00f3ff;
        }
        .fps-graph-bar {
            transition: height 0.1s linear;
        }
        /* Ensure interactive UI elements also hide system cursor */
        button, input, label, a, .glass-panel {
            cursor: none !important;
        }
        /* Custom Math Pointer Cursor Styles */
        #custom-math-cursor {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
            will-change: transform;
        }
        #custom-math-cursor.hovering {
            transform: translate(-50%, -50%) scale(1.4);
        }
        #custom-math-cursor.clicking {
            transform: translate(-50%, -50%) scale(0.9);
        }
        .cursor-trail-dot {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.4s ease, transform 0.4s ease;
            will-change: transform, opacity;
        }
        /* Custom scrollbar for control panel */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 243, 255, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body class="text-slate-100 overflow-hidden bg-black">

    <!-- Custom Glowing Math Pi Cursor -->
    <div id="custom-math-cursor" class="flex items-center justify-center w-10 h-10 rounded-full bg-cyan-500/10 border border-cyan-400/80 shadow-[0_0_18px_rgba(0,243,255,0.6)] backdrop-blur-[2px]">
        <span id="cursor-math-symbol" class="math-font font-bold text-base text-cyan-300 drop-shadow-[0_0_8px_rgba(0,243,255,0.9)] select-none">π</span>
        <!-- Outer Rotating Vector Ring -->
        <div id="cursor-ring" class="absolute inset-0 rounded-full border border-dashed border-cyan-300/40 animate-spin" style="animation-duration: 6s;"></div>
    </div>

    <!-- WebGL Canvas Container -->
    <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

    <!-- UI Overlay Controls & Dashboard -->
    <div class="absolute top-4 left-4 z-20 flex flex-col gap-3 max-w-sm w-[calc(100vw-2rem)] sm:w-80 pointer-events-none">
        
        <!-- Header & FPS Performance Monitor Panel -->
        <div id="control-panel" class="glass-panel p-4 rounded-3xl pointer-events-auto border border-cyan-500/30 space-y-3 max-h-[calc(100vh-2rem)] overflow-y-auto transition-all duration-300">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div id="fps-status-dot" class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></div>
                    <h1 class="text-sm font-extrabold tracking-wide uppercase text-cyan-300 math-font">Vũ Trụ Toán Học 3D</h1>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 font-mono border border-cyan-500/30">120 FPS Max</span>
                    <!-- Collapse / Expand Toggle Button -->
                    <button id="toggle-panel-btn" class="text-xs text-cyan-300 hover:text-white bg-cyan-500/20 hover:bg-cyan-500/40 border border-cyan-500/30 w-7 h-7 rounded-xl flex items-center justify-center transition">
                        <i id="toggle-panel-icon" class="fa-solid fa-chevron-up"></i>
                    </button>
                </div>
            </div>

            <!-- Panel Content Wrapper (Collapsible) -->
            <div id="panel-content" class="space-y-3 transition-all duration-300">
                <!-- Realtime High Precision FPS Graph & Counter -->
                <div class="bg-black/40 p-2.5 rounded-2xl border border-white/5 flex items-center justify-between gap-3">
                    <div class="flex flex-col">
                        <span id="fps-display" class="text-lg font-black font-mono text-cyan-300 leading-none">120 FPS</span>
                        <span id="frame-time-display" class="text-[10px] text-slate-400 font-mono mt-0.5">8.3 ms/frame</span>
                    </div>
                    <div id="fps-graph-container" class="flex items-end gap-1 h-8 w-28 bg-black/50 p-1 rounded-lg border border-white/10 overflow-hidden">
                        <!-- Dynamic Bars injected by JS -->
                    </div>
                </div>

                <!-- Camera Controls -->
                <div class="flex items-center justify-between pt-1">
                    <span class="text-xs text-slate-300 font-medium flex items-center gap-1.5">
                        <i class="fa-solid fa-camera text-cyan-400"></i> Điều khiển góc nhìn
                    </span>
                    <button id="reset-cam-btn" class="text-xs text-slate-300 hover:text-white transition flex items-center gap-1 bg-white/10 hover:bg-white/20 px-2.5 py-1 rounded-lg">
                        <i class="fa-solid fa-rotate-left"></i> Đặt lại
                    </button>
                </div>

                <!-- FPS Mode / High Refresh Rate Settings -->
                <div class="space-y-1.5 bg-cyan-950/40 p-2.5 rounded-2xl border border-cyan-500/30">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold text-cyan-200 flex items-center gap-1.5">
                            <i class="fa-solid fa-gauge-high text-cyan-400"></i> Chế độ Tần Số Quét:
                        </span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs pt-1">
                        <button id="fps-uncapped-btn" class="fps-mode-btn active px-2.5 py-1.5 rounded-xl bg-cyan-500/30 border border-cyan-400 text-cyan-200 font-semibold transition hover:bg-cyan-500/40 flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-bolt text-amber-300"></i> Max (120Hz+)
                        </button>
                        <button id="fps-capped-btn" class="fps-mode-btn px-2.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-slate-300 font-medium transition hover:bg-white/10 flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-lock"></i> Khóa 60 FPS
                        </button>
                    </div>
                </div>

                <!-- Shape Presets -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300 flex items-center justify-between">
                        <span>Hình Khối Trung Tâm:</span>
                    </label>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <button data-shape="sphere" class="shape-btn active px-3 py-2 rounded-xl bg-cyan-500/25 border border-cyan-400/60 text-cyan-300 font-semibold transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-globe"></i> Khối Cầu
                        </button>
                        <button data-shape="torus" class="shape-btn px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-slate-300 font-medium transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-circle-notch"></i> Vòng Torus
                        </button>
                        <button data-shape="fibonacci" class="shape-btn px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-slate-300 font-medium transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-snowflake"></i> Spiral Fibonacci
                        </button>
                        <button data-shape="mobius" class="shape-btn px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-slate-300 font-medium transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-infinity"></i> Dải Möbius
                        </button>
                    </div>
                </div>

                <!-- Color Palette Picker -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Tông Màu Vũ Trụ:</label>
                    <div class="grid grid-cols-4 gap-1.5">
                        <button data-theme="euler" class="theme-btn active p-1.5 rounded-xl border border-amber-400/70 bg-gradient-to-r from-cyan-950 to-amber-950 text-amber-300 text-[10px] font-medium flex flex-col items-center justify-center gap-1">
                            <span class="flex gap-1"><span class="w-2 h-2 rounded-full bg-cyan-400"></span><span class="w-2 h-2 rounded-full bg-amber-400"></span></span>
                            Euler
                        </button>
                        <button data-theme="fractal" class="theme-btn p-1.5 rounded-xl border border-white/10 bg-gradient-to-r from-purple-950 to-pink-950 text-slate-300 text-[10px] font-medium flex flex-col items-center justify-center gap-1">
                            <span class="flex gap-1"><span class="w-2 h-2 rounded-full bg-purple-400"></span><span class="w-2 h-2 rounded-full bg-pink-400"></span></span>
                            Fractal
                        </button>
                        <button data-theme="matrix" class="theme-btn p-1.5 rounded-xl border border-white/10 bg-gradient-to-r from-emerald-950 to-teal-950 text-slate-300 text-[10px] font-medium flex flex-col items-center justify-center gap-1">
                            <span class="flex gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400"></span><span class="w-2 h-2 rounded-full bg-teal-300"></span></span>
                            Matrix
                        </button>
                        <button data-theme="ruby" class="theme-btn p-1.5 rounded-xl border border-white/10 bg-gradient-to-r from-rose-950 to-red-950 text-slate-300 text-[10px] font-medium flex flex-col items-center justify-center gap-1">
                            <span class="flex gap-1"><span class="w-2 h-2 rounded-full bg-rose-400"></span><span class="w-2 h-2 rounded-full bg-amber-400"></span></span>
                            Ruby
                        </button>
                    </div>
                </div>

                <!-- Text Style Backplate Style -->
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-300">Khung Nền Công Thức:</label>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <button id="pill-bg-glass" class="pill-bg-btn active px-2.5 py-1.5 rounded-xl bg-cyan-500/20 border border-cyan-400 text-cyan-200 font-medium">
                            <i class="fa-solid fa-square"></i> Đen Khói Trong
                        </button>
                        <button id="pill-bg-glow" class="pill-bg-btn px-2.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-slate-300 font-medium">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Viền Neon Glow
                        </button>
                    </div>
                </div>

                <!-- Auto Rotate Toggle & Speed -->
                <div class="space-y-2 pt-1">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-medium text-slate-200 flex items-center gap-1.5">
                            <i class="fa-solid fa-arrows-spin text-cyan-400"></i> Tự động xoay
                        </span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="auto-rotate-toggle" class="sr-only peer" checked>
                            <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-cyan-500"></div>
                        </label>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-[10px] text-slate-400 min-w-[55px]">Tốc độ:</span>
                        <input type="range" id="speed-slider" min="0.1" max="3" step="0.1" value="1" class="w-full">
                    </div>
                </div>

                <!-- Formulas density & Precise Scale Slider -->
                <div class="space-y-2">
                    <div class="flex justify-between text-xs text-slate-200 font-medium">
                        <span>Số lượng công thức:</span>
                        <span id="formula-count-text" class="text-cyan-400 font-mono font-bold">24</span>
                    </div>
                    <input type="range" id="density-slider" min="10" max="40" step="2" value="24" class="w-full">

                    <div class="flex justify-between text-xs text-slate-200 font-medium pt-1">
                        <span>Kích thước chữ (Tỉ lệ Vừa Phải):</span>
                        <span id="formula-scale-text" class="text-amber-300 font-mono font-bold">100%</span>
                    </div>
                    <input type="range" id="scale-slider" min="0.5" max="1.5" step="0.05" value="1.0" class="w-full">
                </div>
            </div>
        </div>
    </div>

    <!-- Instruction Tooltip -->
    <div class="absolute top-20 right-6 hidden lg:flex items-center gap-2 glass-panel px-4 py-2 rounded-2xl text-xs text-slate-300 pointer-events-none border border-cyan-500/30">
        <i class="fa-solid fa-hand-pointer text-amber-300 animate-bounce"></i>
        <span>Kéo chuột để xoay 3D | Rê chuột vào công thức để xem chi tiết</span>
    </div>

    <!-- High-Contrast Formula Detail Card -->
    <div id="formula-card" class="absolute bottom-6 right-6 pointer-events-auto opacity-0 transition-all duration-300 transform translate-y-4 glass-panel p-4 rounded-3xl border border-cyan-400/50 text-xs z-30 max-w-sm shadow-2xl space-y-2">
        <div class="flex items-center justify-between border-b border-white/10 pb-2">
            <span class="text-[10px] font-extrabold uppercase tracking-widest text-amber-300 flex items-center gap-1.5">
                <i class="fa-solid fa-atom"></i> Chi Tiết Công Thức
            </span>
            <span id="card-formula-type" class="text-[10px] px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 font-mono border border-cyan-500/30">Mathematical Standard</span>
        </div>
        <div id="card-title" class="text-base font-extrabold text-white math-font tracking-wide bg-black/50 p-2.5 rounded-xl border border-cyan-500/30 text-cyan-200 text-center shadow-inner"></div>
        <div id="card-name" class="font-bold text-amber-300 text-xs"></div>
        <div id="card-desc" class="text-slate-300 text-[11px] leading-relaxed"></div>
    </div>

    <script>
        // Mathematical Formulas Database
        const MATH_FORMULAS = [
            { text: "e^(iπ) + 1 = 0", title: "Đẳng thức Euler", desc: "Được coi là công thức đẹp nhất thế giới toán học, kết nối 5 hằng số cơ bản (e, i, π, 1, 0) trong một phương trình duy nhất." },
            { text: "E = m·c²", title: "Thuyết Tương Đối Hẹp", desc: "Phương trình nổi tiếng của Albert Einstein minh chứng năng lượng và khối lượng có thể chuyển hóa lẫn nhau." },
            { text: "∫ e^(-x²) dx = √π", title: "Tích phân Gauss", desc: "Đặt nền tảng tính toán diện tích dưới đường cong chuông trong Phân phối chuẩn Thống kê & Xác suất." },
            { text: "∇ × B = μ₀J + μ₀ε₀(∂E/∂t)", title: "Phương trình Maxwell-Ampère", desc: "Mô tả sự hình thành từ trường do dòng điện và sự biến thiên của điện trường trong không gian." },
            { text: "∑ 1/n² = π²/6", title: "Bài toán Basel", desc: "Lời giải đột phá năm 1734 của Leonhard Euler cho tổng vô hạn của nghịch đảo các bình phương." },
            { text: "ϕ = (1 + √5) / 2", title: "Tỷ lệ Vàng (Phi)", desc: "Hằng số thẩm mỹ tự nhiên ≈ 1.618 xuất hiện trong cấu trúc vỏ ốc, thiên hà, hình học và nghệ thuật cổ điển." },
            { text: "sin²(θ) + cos²(θ) = 1", title: "Hằng số Lượng giác", desc: "Hệ quả trực tiếp của Định lý Pythagoras trên đường tròn đơn vị tâm O(0,0)." },
            { text: "a² + b² = c²", title: "Định lý Pythagoras", desc: "Mối quan hệ hình học nền tảng giữa ba cạnh của một tam giác vuông." },
            { text: "f'(x) = lim (Δy / Δx)", title: "Định nghĩa Đạo hàm", desc: "Nền tảng của Giải tích Newton & Leibniz, dùng để tính tốc độ biến thiên tức thời." },
            { text: "i² = -1", title: "Đơn vị Hư ảo (Số phức)", desc: "Cơ sở mở rộng tập số thực ℝ sang tập số phức ℂ, cực kỳ quan trọng trong điện tử và cơ học lượng tử." },
            { text: "F = G · (m₁m₂) / r²", title: "Định luật Vạn vật Hấp dẫn", desc: "Phương trình cổ điển của Isaac Newton mô tả lực hút giữa hai vật thể có khối lượng trong vũ trụ." },
            { text: "S = k · ln(Ω)", title: "Công thức Entropy Boltzmann", desc: "Liên kết entropy vi mô nhiệt động lực học với số lượng trạng thái khả dĩ của hệ thống." },
            { text: "ζ(s) = ∑ 1/nˢ", title: "Hàm Zeta Riemann", desc: "Hàm số trung tâm của Lý thuyết Số, liên quan trực tiếp đến giả thuyết Riemann và số nguyên tố." },
            { text: "δS = 0", title: "Nguyên lý Hành động Tối thiểu", desc: "Nguyên lý cơ bản thống nhất quỹ đạo chuyển động của các hạt trong vật lý lý thuyết." },
            { text: "x = (-b ± √(b²-4ac)) / 2a", title: "Công thức Nghiệm Bậc Hai", desc: "Phương pháp Đại số kinh điển giải chính xác mọi phương trình bậc hai một ẩn." },
            { text: "∇ · E = ρ / ε₀", title: "Định luật Gauss cho Điện trường", desc: "Biểu diễn mối liên hệ giữa điện tích và điện trường xung quanh nó." },
            { text: "iℏ (∂Ψ/∂t) = ĤΨ", title: "Phương trình Schrödinger", desc: "Phương trình sóng lượng tử cốt lõi mô tả trạng thái và sự tiến hóa theo thời gian của hệ thống hạt." },
            { text: "e^x = ∑ (xⁿ / n!)", title: "Chuỗi Taylor cho Hàm Mũ", desc: "Biểu diễn hàm số e^x dưới dạng tổng đa thức vô hạn cực kỳ hữu ích trong tính toán số." },
            { text: "F - E + V = 2", title: "Công thức Đa diện Euler", desc: "Định lý Topo cơ bản mối liên hệ giữa số Mặt (F), Cạnh (E) và Đỉnh (V) của khối đa diện lồi." },
            { text: "d/dt (∂L/∂q̇) - ∂L/∂q = 0", title: "Phương trình Euler-Lagrange", desc: "Trọng tâm của cơ học Lagrange, cho phép giải các hệ cơ học phức tạp bằng năng lượng." }
        ];

        // Color Palettes
        const PALETTES = {
            euler: {
                primary: 0x00f3ff,     // Cyan
                secondary: 0xffd700,   // Gold
                textColor: '#ffd700',
                strokeColor: '#00f3ff'
            },
            fractal: {
                primary: 0xc084fc,     // Purple
                secondary: 0xf472b6,   // Pink
                textColor: '#f472b6',
                strokeColor: '#c084fc'
            },
            matrix: {
                primary: 0x10b981,     // Emerald
                secondary: 0x34d399,   // Bright Green
                textColor: '#6ee7b7',
                strokeColor: '#059669'
            },
            ruby: {
                primary: 0xf43f5e,     // Rose
                secondary: 0xfbbf24,   // Amber
                textColor: '#fecdd3',
                strokeColor: '#f43f5e'
            }
        };

        // Core App State
        let currentTheme = 'euler';
        let currentShape = 'sphere';
        let pillBgStyle = 'glass'; // 'glass' or 'glow'
        let autoRotate = true;
        let rotationSpeed = 1.0;
        let formulaDensity = 24;
        
        // PERFECT MODERATE SCALE RATIO
        let userScaleMultiplier = 1.0; // 100% on slider represents the exact moderate standard
        const BASE_MODERATE_3D_WIDTH = 2.4;  // Perfectly moderate medium width in 3D space
        const BASE_MODERATE_3D_HEIGHT = 0.6; // Perfectly moderate medium height in 3D space

        let targetFPS = 0; // 0 = Uncapped (120Hz+), 60 = Capped at 60

        // High Precision FPS Tracker & Delta Time Physics
        let lastFrameTime = performance.now();
        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        // Three.js Core Instances
        let scene, camera, renderer;
        let mainGroup, spaceGroup, coreMeshGroup, formulasGroup;
        let starFieldSystem, nebulaParticlesGroup;
        let raycaster, mouse;
        let activeHoveredSprite = null;

        // Interactive Mouse/Touch Rotation
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotationVelocity = { x: 0.15, y: 0.25 };

        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010103, 0.007);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 24;

            // 3. High Performance Renderer setup
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: false, 
                powerPreference: "high-performance",
                precision: "highp"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.5));
            renderer.setClearColor(0x010103, 1.0);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            // 4. Transform Groups
            spaceGroup = new THREE.Group();
            mainGroup = new THREE.Group();
            coreMeshGroup = new THREE.Group();
            formulasGroup = new THREE.Group();

            mainGroup.add(coreMeshGroup);
            mainGroup.add(formulasGroup);
            
            scene.add(spaceGroup);
            scene.add(mainGroup);

            // 5. Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2(-1000, -1000);

            // 6. Build Scene Components
            buildStarfield();
            buildCosmicNebulae();
            buildCoreShape(currentShape);
            buildFloatingFormulas(formulaDensity);
            setupLighting();

            // 7. FPS Visualizer Bars
            initFpsGraphUI();

            // 8. Event Listeners
            setupEventListeners();
            initCustomMathCursor();

            // 9. Start High-Precision Delta Loop
            lastFrameTime = performance.now();
            requestAnimationFrame(animateLoop);
        }

        // ==========================================
        // BUILDER & HELPER FUNCTIONS
        // ==========================================

        function buildStarfield() {
            if (starFieldSystem) spaceGroup.remove(starFieldSystem);

            const starCount = 3500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);

            const palette = PALETTES[currentTheme];
            const colorPrimary = new THREE.Color(palette.primary);
            const colorSecondary = new THREE.Color(palette.secondary);
            const colorWhite = new THREE.Color(0xffffff);

            for (let i = 0; i < starCount; i++) {
                // Spherical distribution
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                const r = 50 + Math.random() * 120;

                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);

                // Mix star colors
                const randColor = Math.random();
                let starColor;
                if (randColor < 0.6) starColor = colorWhite;
                else if (randColor < 0.85) starColor = colorPrimary;
                else starColor = colorSecondary;

                colors[i * 3] = starColor.r;
                colors[i * 3 + 1] = starColor.g;
                colors[i * 3 + 2] = starColor.b;

                sizes[i] = 1.0 + Math.random() * 2.5;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 1.2,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                sizeAttenuation: true
            });

            starFieldSystem = new THREE.Points(geometry, material);
            spaceGroup.add(starFieldSystem);
        }

        function buildCosmicNebulae() {
            if (nebulaParticlesGroup) spaceGroup.remove(nebulaParticlesGroup);

            nebulaParticlesGroup = new THREE.Group();
            const palette = PALETTES[currentTheme];
            const colors = [palette.primary, palette.secondary, 0x3b82f6];

            for (let i = 0; i < 15; i++) {
                const geo = new THREE.IcosahedronGeometry(4 + Math.random() * 8, 2);
                const mat = new THREE.MeshBasicMaterial({
                    color: colors[i % colors.length],
                    wireframe: true,
                    transparent: true,
                    opacity: 0.04 + Math.random() * 0.05
                });

                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(
                    (Math.random() - 0.5) * 80,
                    (Math.random() - 0.5) * 80,
                    (Math.random() - 0.5) * 80 - 20
                );
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                nebulaParticlesGroup.add(mesh);
            }

            spaceGroup.add(nebulaParticlesGroup);
        }

        function buildCoreShape(shapeType) {
            // Clear current core mesh
            while (coreMeshGroup.children.length > 0) {
                const obj = coreMeshGroup.children[0];
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
                coreMeshGroup.remove(obj);
            }

            const palette = PALETTES[currentTheme];
            const primaryColor = palette.primary;
            const secondaryColor = palette.secondary;

            let mainGeo, outerGeo;

            if (shapeType === 'sphere') {
                mainGeo = new THREE.IcosahedronGeometry(4.5, 3);
                outerGeo = new THREE.IcosahedronGeometry(5.8, 1);
            } else if (shapeType === 'torus') {
                mainGeo = new THREE.TorusKnotGeometry(3.2, 0.9, 120, 16);
                outerGeo = new THREE.TorusGeometry(5.2, 0.2, 16, 100);
            } else if (shapeType === 'fibonacci') {
                mainGeo = new THREE.DodecahedronGeometry(4.2, 2);
                outerGeo = new THREE.IcosahedronGeometry(5.5, 2);
            } else if (shapeType === 'mobius') {
                mainGeo = new THREE.TorusGeometry(3.8, 1.2, 24, 80);
                outerGeo = new THREE.OctahedronGeometry(5.5, 2);
            }

            // Inner Wireframe
            const innerMat = new THREE.MeshBasicMaterial({
                color: primaryColor,
                wireframe: true,
                transparent: true,
                opacity: 0.8
            });
            const innerMesh = new THREE.Mesh(mainGeo, innerMat);
            coreMeshGroup.add(innerMesh);

            // Outer Orbiting Wireframe Shell
            const outerMat = new THREE.MeshBasicMaterial({
                color: secondaryColor,
                wireframe: true,
                transparent: true,
                opacity: 0.25
            });
            const outerMesh = new THREE.Mesh(outerGeo, outerMat);
            coreMeshGroup.add(outerMesh);
        }

        // Texture Generator for HD Clear Math Formula Sprites
        function createFormulaTexture(formulaObj) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            const palette = PALETTES[currentTheme];

            // 1. Draw Glass / Glow Backplate
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const rx = 30, ry = 30, rw = canvas.width - 60, rh = canvas.height - 60;
            const radius = 24;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(rx + radius, ry);
            ctx.lineTo(rx + rw - radius, ry);
            ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + radius);
            ctx.lineTo(rx + rw, ry + rh - radius);
            ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - radius, ry + rh);
            ctx.lineTo(rx + radius, ry + rh);
            ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - radius);
            ctx.lineTo(rx, ry + radius);
            ctx.quadraticCurveTo(rx, ry, rx + radius, ry);
            ctx.closePath();

            if (pillBgStyle === 'glass') {
                ctx.fillStyle = 'rgba(4, 8, 20, 0.82)';
                ctx.fill();
                ctx.lineWidth = 6;
                ctx.strokeStyle = palette.strokeColor;
                ctx.stroke();
            } else { // Neon Glow Mode
                ctx.fillStyle = 'rgba(2, 4, 12, 0.92)';
                ctx.fill();
                ctx.lineWidth = 10;
                ctx.shadowColor = palette.strokeColor;
                ctx.shadowBlur = 20;
                ctx.strokeStyle = palette.strokeColor;
                ctx.stroke();
            }
            ctx.restore();

            // 2. Render Sharp Math Text
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 68px "Cambria Math", "Fira Code", serif';

            // Thick Black Outline for High Contrast
            ctx.lineWidth = 16;
            ctx.strokeStyle = '#000000';
            ctx.strokeText(formulaObj.text, canvas.width / 2, canvas.height / 2);

            // Glowing Main Text Fill
            ctx.fillStyle = palette.textColor;
            ctx.shadowColor = palette.textColor;
            ctx.shadowBlur = 12;
            ctx.fillText(formulaObj.text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.generateMipmaps = true;
            return texture;
        }

        function buildFloatingFormulas(count) {
            // Clear current formulas
            while (formulasGroup.children.length > 0) {
                const sprite = formulasGroup.children[0];
                if (sprite.material) {
                    if (sprite.material.map) sprite.material.map.dispose();
                    sprite.material.dispose();
                }
                formulasGroup.remove(sprite);
            }

            for (let i = 0; i < count; i++) {
                const formulaData = MATH_FORMULAS[i % MATH_FORMULAS.length];
                const texture = createFormulaTexture(formulaData);

                const spriteMaterial = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    depthTest: true,
                    depthWrite: false
                });

                const sprite = new THREE.Sprite(spriteMaterial);

                // Moderate Proportional 3D Size
                const baseW = BASE_MODERATE_3D_WIDTH * userScaleMultiplier;
                const baseH = BASE_MODERATE_3D_HEIGHT * userScaleMultiplier;
                sprite.scale.set(baseW, baseH, 1.0);

                // Fibonacci Golden Spiral Distribution on Sphere Orbit Shell
                const phi = Math.acos(-1 + (2 * i) / count);
                const theta = Math.sqrt(count * Math.PI) * phi;
                const orbitRadius = 9.0 + (i % 3) * 1.5;

                sprite.position.x = orbitRadius * Math.cos(theta) * Math.sin(phi);
                sprite.position.y = orbitRadius * Math.sin(theta) * Math.sin(phi);
                sprite.position.z = orbitRadius * Math.cos(phi);

                sprite.userData = {
                    formula: formulaData,
                    orbitRadius: orbitRadius,
                    phi: phi,
                    theta: theta,
                    orbitSpeed: 0.12 + (i % 5) * 0.04,
                    baseWidth: baseW,
                    baseHeight: baseH
                };

                formulasGroup.add(sprite);
            }
        }

        function updateFormulasScale() {
            formulasGroup.children.forEach(sprite => {
                const w = BASE_MODERATE_3D_WIDTH * userScaleMultiplier;
                const h = BASE_MODERATE_3D_HEIGHT * userScaleMultiplier;
                sprite.userData.baseWidth = w;
                sprite.userData.baseHeight = h;
                if (sprite !== activeHoveredSprite) {
                    sprite.scale.set(w, h, 1.0);
                } else {
                    sprite.scale.set(w * 1.35, h * 1.35, 1.0);
                }
            });
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0x00f3ff, 1.2);
            dirLight1.position.set(10, 20, 15);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffd700, 0.8);
            dirLight2.position.set(-10, -20, -15);
            scene.add(dirLight2);
        }

        function checkFormulaHover() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(formulasGroup.children);

            const card = document.getElementById('formula-card');

            if (intersects.length > 0) {
                const hovered = intersects[0].object;

                if (activeHoveredSprite !== hovered) {
                    if (activeHoveredSprite) {
                        // Reset previous hovered sprite scale
                        const w = activeHoveredSprite.userData.baseWidth;
                        const h = activeHoveredSprite.userData.baseHeight;
                        activeHoveredSprite.scale.set(w, h, 1.0);
                    }

                    activeHoveredSprite = hovered;

                    // Hover scale animation
                    const hw = hovered.userData.baseWidth * 1.35;
                    const hh = hovered.userData.baseHeight * 1.35;
                    hovered.scale.set(hw, hh, 1.0);

                    // Show formula card details
                    if (card) {
                        const data = hovered.userData.formula;
                        document.getElementById('card-title').innerText = data.text;
                        document.getElementById('card-name').innerText = data.title;
                        document.getElementById('card-desc').innerText = data.desc;
                        card.classList.remove('opacity-0', 'translate-y-4');
                        card.classList.add('opacity-100', 'translate-y-0');
                    }
                }
            } else {
                if (activeHoveredSprite) {
                    const w = activeHoveredSprite.userData.baseWidth;
                    const h = activeHoveredSprite.userData.baseHeight;
                    activeHoveredSprite.scale.set(w, h, 1.0);
                    activeHoveredSprite = null;

                    if (card) {
                        card.classList.remove('opacity-100', 'translate-y-0');
                        card.classList.add('opacity-0', 'translate-y-4');
                    }
                }
            }
        }

        function setupEventListeners() {
            // Window Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Pointer Raycasting Position
            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                if (isDragging) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;

                    rotationVelocity.y = deltaX * 0.08;
                    rotationVelocity.x = deltaY * 0.08;

                    previousMousePosition = { x: e.clientX, y: e.clientY };
                }
            });

            // Interactive Drag Controls
            window.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'CANVAS') {
                    isDragging = true;
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                }
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // Touch Support
            window.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1 && e.target.tagName === 'CANVAS') {
                    isDragging = true;
                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                }
            });

            window.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    const deltaX = e.touches[0].clientX - previousMousePosition.x;
                    const deltaY = e.touches[0].clientY - previousMousePosition.y;

                    rotationVelocity.y = deltaX * 0.08;
                    rotationVelocity.x = deltaY * 0.08;

                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                }
            });

            window.addEventListener('touchend', () => {
                isDragging = false;
            });

            // UI Controls Events
            document.getElementById('reset-cam-btn')?.addEventListener('click', () => {
                camera.position.set(0, 0, 24);
                mainGroup.rotation.set(0, 0, 0);
                spaceGroup.rotation.set(0, 0, 0);
            });

            // Toggle Panel Collapse / Expand
            const togglePanelBtn = document.getElementById('toggle-panel-btn');
            const togglePanelIcon = document.getElementById('toggle-panel-icon');
            const panelContent = document.getElementById('panel-content');
            let isPanelCollapsed = false;

            togglePanelBtn?.addEventListener('click', () => {
                isPanelCollapsed = !isPanelCollapsed;
                if (isPanelCollapsed) {
                    panelContent.classList.add('hidden');
                    togglePanelIcon.className = 'fa-solid fa-chevron-down';
                } else {
                    panelContent.classList.remove('hidden');
                    togglePanelIcon.className = 'fa-solid fa-chevron-up';
                }
            });

            // FPS Mode Switcher
            const fpsUncappedBtn = document.getElementById('fps-uncapped-btn');
            const fpsCappedBtn = document.getElementById('fps-capped-btn');

            fpsUncappedBtn?.addEventListener('click', () => {
                targetFPS = 0;
                fpsUncappedBtn.className = 'fps-mode-btn active px-2.5 py-1.5 rounded-xl bg-cyan-500/30 border border-cyan-400 text-cyan-200 font-semibold transition flex items-center justify-center gap-1.5';
                fpsCappedBtn.className = 'fps-mode-btn px-2.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-slate-300 font-medium transition hover:bg-white/10 flex items-center justify-center gap-1.5';
            });

            fpsCappedBtn?.addEventListener('click', () => {
                targetFPS = 60;
                fpsCappedBtn.className = 'fps-mode-btn active px-2.5 py-1.5 rounded-xl bg-cyan-500/30 border border-cyan-400 text-cyan-200 font-semibold transition flex items-center justify-center gap-1.5';
                fpsUncappedBtn.className = 'fps-mode-btn px-2.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-slate-300 font-medium transition hover:bg-white/10 flex items-center justify-center gap-1.5';
            });

            // Shape Selector
            document.querySelectorAll('.shape-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.shape-btn').forEach(b => {
                        b.className = 'shape-btn px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-slate-300 font-medium transition flex items-center justify-center gap-2';
                    });
                    const target = e.currentTarget;
                    target.className = 'shape-btn active px-3 py-2 rounded-xl bg-cyan-500/25 border border-cyan-400/60 text-cyan-300 font-semibold transition flex items-center justify-center gap-2';
                    currentShape = target.getAttribute('data-shape');
                    buildCoreShape(currentShape);
                });
            });

            // Color Palette Selector
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.theme-btn').forEach(b => {
                        b.classList.remove('border-amber-400/70', 'active');
                        b.classList.add('border-white/10');
                    });
                    const target = e.currentTarget;
                    target.classList.remove('border-white/10');
                    target.classList.add('border-amber-400/70', 'active');
                    currentTheme = target.getAttribute('data-theme');

                    buildStarfield();
                    buildCosmicNebulae();
                    buildCoreShape(currentShape);
                    buildFloatingFormulas(formulaDensity);
                });
            });

            // Pill Backplate Toggle
            const pillBgGlass = document.getElementById('pill-bg-glass');
            const pillBgGlow = document.getElementById('pill-bg-glow');

            pillBgGlass?.addEventListener('click', () => {
                pillBgStyle = 'glass';
                pillBgGlass.className = 'pill-bg-btn active px-2.5 py-1.5 rounded-xl bg-cyan-500/20 border border-cyan-400 text-cyan-200 font-medium';
                pillBgGlow.className = 'pill-bg-btn px-2.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-slate-300 font-medium';
                buildFloatingFormulas(formulaDensity);
            });

            pillBgGlow?.addEventListener('click', () => {
                pillBgStyle = 'glow';
                pillBgGlow.className = 'pill-bg-btn active px-2.5 py-1.5 rounded-xl bg-cyan-500/20 border border-cyan-400 text-cyan-200 font-medium';
                pillBgGlass.className = 'pill-bg-btn px-2.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-slate-300 font-medium';
                buildFloatingFormulas(formulaDensity);
            });

            // Auto Rotate Toggle
            document.getElementById('auto-rotate-toggle')?.addEventListener('change', (e) => {
                autoRotate = e.target.checked;
            });

            // Speed Slider
            document.getElementById('speed-slider')?.addEventListener('input', (e) => {
                rotationSpeed = parseFloat(e.target.value);
            });

            // Formula Density Slider
            const densitySlider = document.getElementById('density-slider');
            densitySlider?.addEventListener('input', (e) => {
                formulaDensity = parseInt(e.target.value);
                document.getElementById('formula-count-text').innerText = formulaDensity;
                buildFloatingFormulas(formulaDensity);
            });

            // Formula Scale Slider
            const scaleSlider = document.getElementById('scale-slider');
            scaleSlider?.addEventListener('input', (e) => {
                userScaleMultiplier = parseFloat(e.target.value);
                document.getElementById('formula-scale-text').innerText = `${Math.round(userScaleMultiplier * 100)}%`;
                updateFormulasScale();
            });
        }

        // Custom Mathematical Cursor & Trail Particles
        function initCustomMathCursor() {
            const cursor = document.getElementById('custom-math-cursor');
            const symbolEl = document.getElementById('cursor-math-symbol');
            const ringEl = document.getElementById('cursor-ring');
            
            let mouseX = -100, mouseY = -100;
            let lastTrailTime = 0;

            const mathSymbols = ['π', '∑', '√', '∫', '∞', 'ϕ', 'Δ', '∂'];
            let currentSymbolIdx = 0;

            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;

                cursor.style.left = `${mouseX}px`;
                cursor.style.top = `${mouseY}px`;

                // Spawn cursor particle trail
                const now = performance.now();
                if (now - lastTrailTime > 35) { // ~30 particles per sec max
                    createTrailParticle(mouseX, mouseY);
                    lastTrailTime = now;
                }
            });

            window.addEventListener('mousedown', () => {
                cursor.classList.add('clicking');
                // Cycle math symbol on click
                currentSymbolIdx = (currentSymbolIdx + 1) % mathSymbols.length;
                symbolEl.innerText = mathSymbols[currentSymbolIdx];
            });

            window.addEventListener('mouseup', () => {
                cursor.classList.remove('clicking');
            });

            // Detect UI element hover (Dynamically using event delegation for scrollable elements)
            document.addEventListener('mouseover', (e) => {
                const target = e.target.closest('button, input, a, label, .shape-btn, .theme-btn, .pill-bg-btn');
                if (target) {
                    cursor.classList.add('hovering');
                    symbolEl.classList.remove('text-cyan-300');
                    symbolEl.classList.add('text-amber-300');
                    cursor.style.borderColor = 'rgba(251, 191, 36, 0.9)';
                    ringEl.style.borderColor = 'rgba(251, 191, 36, 0.6)';
                }
            });

            document.addEventListener('mouseout', (e) => {
                const target = e.target.closest('button, input, a, label, .shape-btn, .theme-btn, .pill-bg-btn');
                if (target) {
                    cursor.classList.remove('hovering');
                    symbolEl.classList.remove('text-amber-300');
                    symbolEl.classList.add('text-cyan-300');
                    cursor.style.borderColor = 'rgba(0, 243, 255, 0.8)';
                    ringEl.style.borderColor = 'rgba(0, 243, 255, 0.4)';
                }
            });
        }

        function createTrailParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'cursor-trail-dot';
            
            const size = 3 + Math.random() * 4;
            const theme = PALETTES[currentTheme];
            const colorHex = '#' + theme.primary.toString(16).padStart(6, '0');

            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            particle.style.backgroundColor = colorHex;
            particle.style.boxShadow = `0 0 10px ${colorHex}`;

            document.body.appendChild(particle);

            requestAnimationFrame(() => {
                particle.style.opacity = '0';
                particle.style.transform = `translate(-50%, -50%) scale(0.2) translate(${(Math.random() - 0.5) * 20}px, ${(Math.random() - 0.5) * 20}px)`;
            });

            setTimeout(() => {
                if (particle.parentNode) particle.parentNode.removeChild(particle);
            }, 450);
        }

        function initFpsGraphUI() {
            const container = document.getElementById('fps-graph-container');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                const bar = document.createElement('div');
                bar.className = 'fps-graph-bar flex-1 bg-cyan-400/80 rounded-t-sm';
                bar.style.height = '70%';
                container.appendChild(bar);
            }
        }

        function updateFpsGraphUI(fps) {
            const container = document.getElementById('fps-graph-container');
            if (!container) return;
            const bars = container.children;
            if (bars.length === 0) return;

            const normalizedHeight = Math.min(100, Math.max(10, (fps / 120) * 100));

            for (let i = 0; i < bars.length - 1; i++) {
                bars[i].style.height = bars[i + 1].style.height;
            }
            bars[bars.length - 1].style.height = `${normalizedHeight}%`;

            const dot = document.getElementById('fps-status-dot');
            if (dot) {
                if (fps >= 90) {
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse';
                } else if (fps >= 55) {
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse';
                } else {
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse';
                }
            }
        }

        // ULTRA 120 FPS DELTA TIME LOOP
        function animateLoop(currentTime) {
            requestAnimationFrame(animateLoop);

            const deltaMs = currentTime - lastFrameTime;

            if (targetFPS > 0) {
                const minFrameInterval = 1000 / targetFPS;
                if (deltaMs < minFrameInterval - 1) {
                    return;
                }
            }

            const deltaSec = Math.min(deltaMs / 1000, 0.1);
            lastFrameTime = currentTime;

            frameCount++;
            if (currentTime - lastFpsUpdate >= 250) {
                const currentFPS = Math.round((frameCount * 1000) / (currentTime - lastFpsUpdate));
                const fpsDisp = document.getElementById('fps-display');
                const frameTimeDisp = document.getElementById('frame-time-display');
                
                if (fpsDisp) fpsDisp.innerText = `${currentFPS} FPS`;
                if (frameTimeDisp) frameTimeDisp.innerText = `${(1000 / Math.max(currentFPS, 1)).toFixed(1)} ms/frame`;
                
                updateFpsGraphUI(currentFPS);

                frameCount = 0;
                lastFpsUpdate = currentTime;
            }

            // 1. Mouse Dragging Rotation
            if (isDragging) {
                mainGroup.rotation.y += rotationVelocity.y * deltaSec * 3.0;
                mainGroup.rotation.x += rotationVelocity.x * deltaSec * 3.0;
                spaceGroup.rotation.y += rotationVelocity.y * deltaSec * 0.8;
                spaceGroup.rotation.x += rotationVelocity.x * deltaSec * 0.8;
            } else if (autoRotate) {
                mainGroup.rotation.y += rotationVelocity.y * deltaSec * rotationSpeed;
                mainGroup.rotation.x += rotationVelocity.x * deltaSec * rotationSpeed;

                spaceGroup.rotation.y += rotationVelocity.y * deltaSec * 0.2 * rotationSpeed;

                rotationVelocity.x += (0.15 - rotationVelocity.x) * deltaSec * 2.0;
                rotationVelocity.y += (0.25 - rotationVelocity.y) * deltaSec * 2.0;
            }

            // 2. Central Wireframe Geometry Rotation
            coreMeshGroup.children.forEach((mesh, idx) => {
                const dir = (idx % 2 === 0) ? 0.35 : -0.45;
                mesh.rotation.y += dir * deltaSec * rotationSpeed;
                mesh.rotation.z += 0.12 * deltaSec * rotationSpeed;
            });

            // 3. Floating Formulas Orbit Motion
            formulasGroup.children.forEach((sprite) => {
                // Freeze or slow down orbit if hovered
                const speedFactor = (sprite === activeHoveredSprite) ? 0.05 : 1.0;
                
                sprite.userData.phi += sprite.userData.orbitSpeed * deltaSec * rotationSpeed * speedFactor;
                const r = sprite.userData.orbitRadius;
                const phi = sprite.userData.phi;
                const theta = sprite.userData.theta;

                sprite.position.x = r * Math.cos(phi) * Math.sin(theta);
                sprite.position.y = r * Math.sin(phi) * Math.sin(theta);
                sprite.position.z = r * Math.cos(theta);
            });

            // 4. Raycast Hover Check
            checkFormulaHover();

            // 5. Render Scene
            renderer.render(scene, camera);
        }

        window.onload = () => {
            init();
        };
    </script>
</body>
</html>
